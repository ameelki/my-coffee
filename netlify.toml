[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist/coffee/browser"

[build.environment]
  NODE_VERSION = "20"

# IMPORTANT : remplacez l'URL ci-dessous par celle de votre backend Render.
[[redirects]]
  from = "/api/*"
  to = "https://REMPLACEZ-MOI.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
