[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist/coffee/browser"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://coffee-backend-82dz.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
