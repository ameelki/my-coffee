spring.application.name=coffee-events
server.port=${PORT:8080}

# ===== Base de données PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coffee}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update : crée / complète les tables sans effacer les données
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.time-zone=Europe/Luxembourg
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT : secret d'au moins 32 caractères =====
app.jwt.secret=${JWT_SECRET:CHANGE_ME_with_a_very_long_random_secret_key_32chars_min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ===== Comptes créés au premier démarrage (à changer !) =====
app.admin.email=${ADMIN_EMAIL:admin@coffee.lu}
app.admin.password=${ADMIN_PASSWORD:changeme123}
app.kitchen.email=${KITCHEN_EMAIL:cuisine@coffee.lu}
app.kitchen.password=${KITCHEN_PASSWORD:changeme123}
# Données d'exemple (carte, formules, tables) au premier démarrage uniquement
app.seed-demo=${SEED_DEMO:true}

# ===== CORS (adresses du front, séparées par des virgules) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Emails (facultatif) : sans SPRING_MAIL_HOST les emails sont seulement écrits dans les logs =====
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@coffee.lu}
app.front-url=${FRONT_URL:http://localhost:4200}

management.endpoints.web.exposure.include=health
